name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Koka (Unix)
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Hica (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://www.hica.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify tools
        run: |
          koka --version
          hica --version
        shell: bash

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: bookstore-macos-arm64
            imgui_asset: libimgui_hica-macos-arm64.a
          - os: ubuntu-latest
            artifact: bookstore-linux-x86_64
            imgui_asset: libimgui_hica-linux-x86_64.a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Install Koka
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Hica
        run: |
          curl -fsSL https://www.hica.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download imgui library
        run: |
          curl -fsSL -o lib/libimgui_hica.a \
            https://github.com/cladam/imgui/releases/latest/download/${{ matrix.imgui_asset }}

      - name: Patch link flags for Linux
        if: runner.os == 'Linux'
        run: |
          sed -i 's| --cclinkopts=-L/opt/homebrew/opt/sdl2/lib||g' hica.hml
          sed -i 's|--cclinkopts=-framework --cclinkopts=OpenGL|--cclinkopts=-lGL|g' hica.hml
          sed -i 's|--cclinkopts=-lc++|--cclinkopts=-lstdc++|g' hica.hml

      - name: Build binary
        run: hica build -o EBI

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force EBI

      - name: Package
        run: tar czf ${{ matrix.artifact }}.tar.gz EBI

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            install.sh
